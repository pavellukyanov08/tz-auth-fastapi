services:
  app:
    container_name: tz_auth_app
    build:
      context: .
    ports:
      - "9999:8000"
    depends_on:
      - db
    restart: always
    env_file:
      - .env

  db:
    container_name: tz_auth_db
    image: postgres:latest
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - tz_auth_network
    env_file:
      - .env

  redis:
    image: redis:latest
    container_name: tz_auth_redis
    ports:
      - "6377:6379"
    restart: always
    volumes:
      - tz_auth-redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ./users.acl:/usr/local/etc/redis/users.acl
    env_file:
      - .env
    networks:
      - tz_auth_network
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

volumes:
  tz_auth-redis-data:
  postgres_data:

networks:
  tz_auth_network:
    driver: bridge