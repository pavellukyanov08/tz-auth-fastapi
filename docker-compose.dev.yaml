services:
  app:
    container_name: tz_auth_app
    build:
      context: .
    ports:
      - "9998:80"
    depends_on:
      - db
    restart: always
    networks:
      - tz_auth_network
    env_file:
      - .env.docker

  db:
    container_name: tz_auth_db
    image: postgres:latest
    ports:
      - "5429:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - tz_auth_network
    env_file:
      - .env.docker

